services:

  backend:
    build:
      context: ./backend
    container_name: riskguard-backend-dev
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - riskguard-data-dev:/app/instance
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/Angular
      dockerfile: Dockerfile.dev
    container_name: riskguard-frontend-dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend/Angular:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  riskguard-data-dev: