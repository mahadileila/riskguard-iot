services:

  backend:
    build:
      context: ./backend
    container_name: riskguard-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - riskguard-data:/app/instance
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/Angular
      dockerfile: Dockerfile
    container_name: riskguard-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  riskguard-data: