<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-sm">

    <div class="flex flex-col items-center mb-6">
      <div class="w-12 h-12 rounded-full bg-blue-600 mb-3"></div>
      <h1 class="text-xl font-semibold text-gray-900">Privacy risk dashboard</h1>
      <p class="text-sm text-gray-500">Smart building devices</p>
    </div>

    @if (error) {
      <p class="text-red-600 text-sm mb-4 text-center">{{ error }}</p>
    }

    <label class="block text-sm text-gray-600 mb-1">Username</label>
    <input
      [(ngModel)]="username"
      (keyup.enter)="submit()"
      class="w-full border border-gray-300 rounded-md px-3 py-2 mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="e.g. admin"
    />

    <label class="block text-sm text-gray-600 mb-1">Password</label>
    <div class="relative">
      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        name="password"
        class="w-full border border-gray-300 rounded-md px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Password"
      />

      <button
        type="button"
        (click)="showPassword = !showPassword"
        class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      >
        @if (showPassword) {
          <!-- eye-off -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        } @else {
          <!-- eye -->
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        }
      </button>
    </div>

    <button
      (click)="submit()"
      [disabled]="loading"
      class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-sm font-medium disabled:opacity-50"
    >
      {{ loading ? 'Logging in...' : 'Log in' }}
    </button>

  </div>

</div>
