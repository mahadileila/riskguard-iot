<div class="relative w-56">

  <span class="mb-1 block text-xs font-medium uppercase tracking-wide text-gray-500">
    {{ label }}
  </span>

  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled"
    class="flex w-full items-center justify-between rounded-md border border-gray-300 bg-white px-3 py-2 text-sm hover:border-gray-400 disabled:cursor-not-allowed disabled:bg-gray-50 disabled:text-gray-400"
  >
    <span class="truncate">{{ selectedOption ? selectedOption.label : allLabel }}</span>

    <svg class="h-4 w-4 shrink-0 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.17l3.71-3.94a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
    </svg>
  </button>

  @if (open) {

    <div class="absolute z-30 mt-1 w-full rounded-lg border border-gray-200 bg-white shadow-lg">

      <div class="border-b border-gray-100 p-2">
        <input
          [(ngModel)]="search"
          placeholder="Search..."
          class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <ul class="max-h-64 overflow-y-auto py-1 text-sm">

        <li>
          <button
            type="button"
            (click)="select(null)"
            class="w-full px-3 py-2 text-left hover:bg-gray-50"
            [class.font-semibold]="selected === null"
          >
            {{ allLabel }}
          </button>
        </li>

        @for (o of filteredOptions; track o.value) {

          <li>
            <button
              type="button"
              (click)="select(o.value)"
              class="flex w-full items-center justify-between px-3 py-2 hover:bg-gray-50"
              [class.bg-blue-50]="o.value === selected"
            >
              <span class="flex min-w-0 items-center">
                @if (o.color) {
                  <span
                    class="mr-2 inline-block h-2 w-2 shrink-0 rounded-full"
                    [style.background-color]="o.color"
                  ></span>
                }
                <span class="truncate">{{ o.label }}</span>
              </span>

              @if (o.count !== undefined) {
                <span class="ml-2 text-gray-400">{{ o.count }}</span>
              }
            </button>
          </li>

        }

        @if (filteredOptions.length === 0) {
          <li class="px-3 py-2 text-gray-400">No results</li>
        }

      </ul>

    </div>

  }

</div>
